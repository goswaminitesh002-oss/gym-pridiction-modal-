<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartGym AI</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="login-page">

    <div class="background-glow"></div>

    <div class="login-card">

        <div class="logo">
            🏋️
            <h1>SmartGym AI</h1>
        </div>

        <h2>Welcome Back 👋</h2>

        <p>
            Sign in to continue your AI powered fitness journey.
        </p>

        <form id="loginForm">

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <div class="input-box password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                >
                    👁
                </button>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

            <div class="divider">
                OR
            </div>

            <button
                type="button"
                class="google-btn"
            >
                Continue with Google
            </button>

        </form>

        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">

                Create Account

            </a>

        </p>

    </div>

</div>

<script src="assets/js/login.js"></script>

</body>
</html>
